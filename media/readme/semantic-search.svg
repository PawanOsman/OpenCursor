<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title description" font-family="Segoe UI, Inter, Arial, sans-serif">
<title id="title">Workspace search and bounded documentation indexing</title><desc id="description">Workspace files feed a local index that returns relevant code context. Documentation discovery creates a finite page plan, and indexing fetches only selected pages. Links found in fetched pages do not grow the plan.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#8b7cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="1438" height="648" rx="26" fill="#17181d" stroke="#3b3c47"/>
<text x="48" y="49" font-size="15" fill="#8b7cf8" font-weight="600" letter-spacing="2.2">WORKSPACE + DOCUMENTATION</text><text x="48" y="102" font-size="42" fill="#f5f5f8" font-weight="650" >Give the agent useful context.</text><text x="48" y="144" font-size="23" fill="#adaebc" font-weight="400" >Find relevant code and index documentation with a finite, reviewable page plan.</text><text x="48" y="190" font-size="14" fill="#adaebc" font-weight="600" letter-spacing="1.6">WORKSPACE SEARCH</text><rect x="48" y="214" width="396" height="138" rx="18" fill="#22232b" stroke="#3b3c47"/><g transform="translate(72 244) scale(1.2083333333333333)" fill="none" stroke="#8b7cf8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9Zm0 0v7h7M7 14h10M7 18h7"/></g><text x="119" y="269" font-size="27" fill="#f5f5f8" font-weight="600" >Workspace files</text><text x="72" y="318" font-size="21" fill="#adaebc" font-weight="400" >The code you are working in</text><path d="M458 283H504V283" fill="none" stroke="#8b7cf8" stroke-width="2" marker-end="url(#arrow)"/><rect x="522" y="214" width="396" height="138" rx="18" fill="#22232b" stroke="#3b3c47"/><g transform="translate(546 244) scale(1.2083333333333333)" fill="none" stroke="#8b7cf8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="8" height="8" rx="2"/><rect x="14" y="2" width="8" height="8" rx="2"/><rect x="2" y="14" width="8" height="8" rx="2"/><rect x="14" y="14" width="8" height="8" rx="2"/></g><text x="593" y="269" font-size="27" fill="#f5f5f8" font-weight="600" >Local index</text><text x="546" y="318" font-size="21" fill="#adaebc" font-weight="400" >Embed and retrieve locally</text><path d="M932 283H978V283" fill="none" stroke="#8b7cf8" stroke-width="2" marker-end="url(#arrow)"/><rect x="996" y="214" width="396" height="138" rx="18" fill="#242d2a" stroke="#3d5147"/><g transform="translate(1020 244) scale(1.2083333333333333)" fill="none" stroke="#9cddbe" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></g><text x="1067" y="269" font-size="27" fill="#f5f5f8" font-weight="600" >Relevant context</text><text x="1020" y="318" font-size="21" fill="#adaebc" font-weight="400" >Find related code by meaning</text><text x="48" y="397" font-size="14" fill="#adaebc" font-weight="600" letter-spacing="1.6">DOCUMENTATION INDEXING</text><rect x="48" y="421" width="396" height="138" rx="18" fill="#22232b" stroke="#3b3c47"/><g transform="translate(72 451) scale(1.2083333333333333)" fill="none" stroke="#8b7cf8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5C8 2 4 2 2 3v17c4-1 7-1 10 1 3-2 6-2 10-1V3c-2-1-6-1-10 2Zm0 0v16"/></g><text x="119" y="476" font-size="27" fill="#f5f5f8" font-weight="600" >Documentation</text><text x="72" y="525" font-size="21" fill="#adaebc" font-weight="400" >Choose a source and scope</text><path d="M458 490H504V490" fill="none" stroke="#8b7cf8" stroke-width="2" marker-end="url(#arrow)"/><rect x="522" y="421" width="396" height="138" rx="18" fill="#22232b" stroke="#3b3c47"/><g transform="translate(546 451) scale(1.2083333333333333)" fill="none" stroke="#8b7cf8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m2 5 2 2 4-4M11 5h11M2 13h5M11 13h11M2 21h5M11 21h11"/></g><text x="593" y="476" font-size="27" fill="#f5f5f8" font-weight="600" >Finite page plan</text><text x="546" y="525" font-size="21" fill="#adaebc" font-weight="400" >Select the pages you need</text><path d="M932 490H978V490" fill="none" stroke="#8b7cf8" stroke-width="2" marker-end="url(#arrow)"/><rect x="996" y="421" width="396" height="138" rx="18" fill="#242d2a" stroke="#3d5147"/><g transform="translate(1020 451) scale(1.2083333333333333)" fill="none" stroke="#9cddbe" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="m3 12 6 6L21 6"/></g><text x="1067" y="476" font-size="27" fill="#f5f5f8" font-weight="600" >Selected pages</text><text x="1020" y="525" font-size="21" fill="#adaebc" font-weight="400" >Fetch and index this set only</text><text x="48" y="615" font-size="21" fill="#adaebc" font-weight="400" >Fetched pages never expand the documentation plan. Keep the scope and resource limits under your control.</text>
</svg>
